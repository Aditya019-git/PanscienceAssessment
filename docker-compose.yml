services:
  postgres:
    image: postgres:17-alpine
    container_name: panscience-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panscience}
      POSTGRES_USER: ${POSTGRES_USER:-panscience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panscience}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: panscience-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build:
      context: ./backend
    container_name: panscience-backend
    depends_on:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panscience}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-panscience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panscience}
      POSTGRES_PORT: 5432
      SERVER_PORT: 8080
      APP_UPLOAD_DIR: /app/uploads
      FRONTEND_ORIGIN: http://localhost:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      WHISPER_PROVIDER: ${WHISPER_PROVIDER:-openai}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      APP_RETRIEVAL_TOP_K: ${APP_RETRIEVAL_TOP_K:-5}
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: panscience-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
