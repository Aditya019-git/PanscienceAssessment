spring:
  datasource:
    url: jdbc:h2:mem:assessment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

app:
  storage:
    upload-dir: build/test-uploads
