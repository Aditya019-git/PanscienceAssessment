spring:
  application:
    name: assessment-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:panscience}
    username: ${POSTGRES_USER:panscience}
    password: ${POSTGRES_PASSWORD:panscience}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 250MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  storage:
    upload-dir: ${APP_UPLOAD_DIR:uploads}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  transcription:
    provider: ${WHISPER_PROVIDER:openai}
    model: ${OPENAI_TRANSCRIPTION_MODEL:whisper-1}
  retrieval:
    top-k: ${APP_RETRIEVAL_TOP_K:5}
